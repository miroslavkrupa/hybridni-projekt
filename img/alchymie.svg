<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t">
  <title id="t">Projektový manažer jako alchymista vaří v kotli projektovou metodiku</title>
  <defs>
    <clipPath id="frame"><rect width="600" height="420" rx="22"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211d36"/>
      <stop offset="1" stop-color="#15121f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1828"/>
      <stop offset="1" stop-color="#0e0c14"/>
    </linearGradient>
    <linearGradient id="windowGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5a9e"/>
      <stop offset="1" stop-color="#232b55"/>
    </linearGradient>
    <radialGradient id="potion" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#c8fff4"/>
      <stop offset=".35" stop-color="#5fe0c8"/>
      <stop offset=".8" stop-color="#1f9d8a"/>
      <stop offset="1" stop-color="#0f5249"/>
    </radialGradient>
    <radialGradient id="potionGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5fe0c8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5fe0c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff9a3d" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2638"/>
      <stop offset=".45" stop-color="#3b3650"/>
      <stop offset="1" stop-color="#16141d"/>
    </linearGradient>
    <linearGradient id="ironBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#ff8a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1838"/>
      <stop offset=".6" stop-color="#2f2862"/>
      <stop offset="1" stop-color="#3f3a86"/>
    </linearGradient>
    <linearGradient id="robeLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe0c8" stop-opacity="0"/>
      <stop offset="1" stop-color="#5fe0c8" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2452"/>
      <stop offset="1" stop-color="#3d3780"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3d33"/>
      <stop offset=".55" stop-color="#b98468"/>
      <stop offset="1" stop-color="#d9b29a"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c29077"/>
      <stop offset="1" stop-color="#8fd9cb"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9481c"/>
      <stop offset=".5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e3c4"/>
      <stop offset="1" stop-color="#cdb68c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- dílna: stěna, kameny, podlaha -->
    <rect width="600" height="420" fill="url(#wall)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="2">
      <path d="M0 60 H600 M0 125 H600 M0 190 H600 M0 255 H600"/>
      <path d="M70 0 V60 M210 0 V60 M350 0 V60 M500 0 V60 M140 60 V125 M290 60 V125 M430 60 V125 M560 60 V125 M60 125 V190 M240 125 V190 M400 125 V190 M520 125 V190 M120 190 V255 M300 190 V255 M470 190 V255"/>
    </g>
    <rect y="320" width="600" height="100" fill="url(#floor)"/>
    <path d="M0 320 H600" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>

    <!-- okno s měsícem za postavou -->
    <path d="M26 156 V84 Q76 26 126 84 V156 Z" fill="url(#windowGlass)"/>
    <circle cx="58" cy="76" r="12" fill="#e8ecff" opacity=".9"/>
    <circle cx="63" cy="72" r="11" fill="#3f4d8f" opacity=".75"/>
    <path d="M76 42 V156 M26 112 H126" stroke="#15121f" stroke-width="5"/>
    <path d="M26 156 V84 Q76 26 126 84 V156" fill="none" stroke="#2c2740" stroke-width="7"/>
    <path d="M20 160 H132" stroke="#2c2740" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 156 L120 330 L190 330 L126 156 Z" fill="#9fb0ff" opacity=".04"/>

    <!-- police s lahvičkami, knihami a přesýpacími hodinami -->
    <g>
      <rect x="462" y="128" width="130" height="7" rx="2" fill="#4a3a2c"/>
      <rect x="462" y="212" width="130" height="7" rx="2" fill="#4a3a2c"/>
      <path d="M476 128 V112 Q476 104 482 104 V96 H488 V104 Q494 104 494 112 V128 Z" fill="#6a3d8f" opacity=".85"/>
      <rect x="480" y="92" width="10" height="5" rx="1" fill="#8a6a4c"/>
      <circle cx="514" cy="117" r="11" fill="#1f9d8a" opacity=".8"/>
      <rect x="510" y="96" width="8" height="12" fill="#1f9d8a" opacity=".8"/>
      <circle cx="514" cy="117" r="11" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="536" y="98" width="12" height="30" rx="2" fill="#7b2d3a"/>
      <rect x="549" y="102" width="10" height="26" rx="2" fill="#3e5a8a"/>
      <rect x="560" y="95" width="13" height="33" rx="2" fill="#8a6a2c"/>
      <rect x="538" y="104" width="8" height="2" fill="#d9b25a" opacity=".7"/>
      <rect x="562" y="102" width="9" height="2" fill="#f1e3c4" opacity=".6"/>
      <!-- přesýpací hodiny -->
      <rect x="474" y="176" width="30" height="5" rx="2" fill="#8a6a4c"/>
      <rect x="474" y="207" width="30" height="5" rx="2" fill="#8a6a4c"/>
      <path d="M479 181 Q479 194 489 194 Q499 194 499 181 Z" fill="#cfe7ff" opacity=".35"/>
      <path d="M479 207 Q479 194 489 194 Q499 194 499 207 Z" fill="#cfe7ff" opacity=".35"/>
      <path d="M483 207 Q489 197 495 207 Z" fill="#d9b25a"/>
      <path d="M486 184 L492 184 L489 190 Z" fill="#d9b25a"/>
      <!-- svitek -->
      <rect x="520" y="194" width="58" height="16" rx="8" fill="url(#parchment)"/>
      <circle cx="528" cy="202" r="8" fill="#b89d70"/>
      <rect x="538" y="199" width="26" height="2.5" rx="1" fill="#7a5a3a" opacity=".6"/>
      <rect x="538" y="204" width="18" height="2.5" rx="1" fill="#7a5a3a" opacity=".6"/>
    </g>

    <!-- záře ohně a lektvaru -->
    <ellipse cx="368" cy="350" rx="170" ry="40" fill="url(#fireGlow)"/>
    <ellipse cx="368" cy="215" rx="190" ry="120" fill="url(#potionGlow)"/>

    <!-- oheň -->
    <g>
      <rect x="312" y="350" width="112" height="13" rx="6" fill="#3a2418" transform="rotate(-5 368 356)"/>
      <rect x="316" y="352" width="106" height="12" rx="6" fill="#4a2e1e" transform="rotate(6 368 356)"/>
      <g filter="url(#glow)">
        <path d="M326 354 C318 336 332 326 330 310 C344 322 350 340 340 354 Z" fill="url(#flame)"/>
        <path d="M352 356 C340 330 360 312 356 290 C380 310 388 336 376 356 Z" fill="url(#flame)"/>
        <path d="M386 354 C380 336 392 326 392 312 C406 324 410 342 400 354 Z" fill="url(#flame)"/>
      </g>
    </g>

    <!-- kotel -->
    <ellipse cx="320" cy="338" rx="12" ry="7" fill="#100e16"/>
    <ellipse cx="416" cy="338" rx="12" ry="7" fill="#100e16"/>
    <path d="M262 236 Q258 304 312 334 L424 334 Q478 304 474 236 Q440 254 368 254 Q296 254 262 236 Z" fill="url(#iron)"/>
    <path d="M262 236 Q258 304 312 334 L424 334 Q478 304 474 236 Q440 254 368 254 Q296 254 262 236 Z" fill="url(#ironBottom)"/>
    <path d="M276 262 Q282 300 316 322" stroke="#5fe0c8" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="368" cy="236" rx="110" ry="21" fill="#2f2b40"/>
    <ellipse cx="368" cy="236" rx="110" ry="21" fill="none" stroke="#8fe9da" stroke-opacity=".45" stroke-width="2"/>
    <ellipse cx="368" cy="234" rx="95" ry="14" fill="url(#potion)"/>
    <path d="M300 233 Q330 226 360 233 T430 231" stroke="#ffffff" stroke-opacity=".45" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="398" cy="231" r="3.5" fill="#e6fffa" opacity=".9"/>
    <circle cx="336" cy="238" r="2.5" fill="#e6fffa" opacity=".8"/>
    <circle cx="416" cy="238" r="2" fill="#e6fffa" opacity=".8"/>

    <!-- pára a znamení metodik -->
    <g fill="none" stroke-linecap="round">
      <path d="M352 222 C336 196 366 182 350 152 C338 128 360 112 350 88" stroke="#9ff0e3" stroke-opacity=".22" stroke-width="10" filter="url(#soft)"/>
      <path d="M390 222 C404 200 382 186 398 160 C410 140 396 124 404 104" stroke="#9ff0e3" stroke-opacity=".18" stroke-width="8" filter="url(#soft)"/>
      <path d="M352 222 C340 200 362 186 350 158" stroke="#bff6ec" stroke-opacity=".35" stroke-width="2"/>
      <path d="M390 222 C400 204 386 190 396 170" stroke="#bff6ec" stroke-opacity=".3" stroke-width="2"/>
    </g>
    <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- sprint: smyčka se šipkou -->
      <path d="M322 120 A22 22 0 1 1 344 142" stroke="#9ff0e3" stroke-width="3"/>
      <path d="M350 135 L343 142 L350 149" stroke="#9ff0e3" stroke-width="3"/>
      <!-- Gantt: pruhy na časové ose -->
      <path d="M392 64 V108 H448" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.6"/>
      <path d="M400 74 H420 M412 86 H436 M426 98 H444" stroke="#ffd27a" stroke-width="5"/>
      <!-- kanban: sloupce s kartičkami -->
      <rect x="430" y="140" width="9" height="9" rx="1.5" stroke="#c8bfff" stroke-width="2"/>
      <rect x="430" y="153" width="9" height="9" rx="1.5" stroke="#c8bfff" stroke-width="2"/>
      <rect x="443" y="140" width="9" height="9" rx="1.5" stroke="#c8bfff" stroke-width="2"/>
      <rect x="456" y="140" width="9" height="9" rx="1.5" stroke="#c8bfff" stroke-width="2"/>
      <rect x="456" y="153" width="9" height="9" rx="1.5" stroke="#c8bfff" stroke-width="2"/>
      <rect x="456" y="166" width="9" height="9" rx="1.5" stroke="#c8bfff" stroke-width="2"/>
    </g>
    <!-- jiskry a částice -->
    <g fill="#e6fffa" filter="url(#glow)">
      <circle cx="318" cy="186" r="1.8"/><circle cx="334" cy="168" r="1.4"/><circle cx="410" cy="196" r="1.6"/>
      <circle cx="378" cy="150" r="1.2"/><circle cx="300" cy="150" r="1.3"/><circle cx="424" cy="122" r="1.5"/>
      <circle cx="372" cy="56" r="1.4"/><circle cx="452" cy="196" r="1.2"/>
    </g>
    <g fill="#ffd27a" filter="url(#glow)">
      <circle cx="310" cy="206" r="1.6"/><circle cx="292" cy="196" r="1.2"/><circle cx="302" cy="186" r="1"/>
    </g>

    <!-- vznášející se kniha receptů s Ganttem -->
    <g transform="rotate(-8 262 96)" filter="url(#glow)">
      <path d="M220 86 Q240 78 262 86 L262 120 Q240 112 220 120 Z" fill="url(#parchment)"/>
      <path d="M262 86 Q284 78 304 86 L304 120 Q284 112 262 120 Z" fill="url(#parchment)"/>
      <path d="M218 88 V123 Q240 115 262 123 Q284 115 306 123 V88" fill="none" stroke="#5a3a26" stroke-width="2.5"/>
      <path d="M262 86 V120" stroke="#8a6a4c" stroke-width="1"/>
      <path d="M228 92 H240 M234 98 H250 M242 104 H254 M228 110 H246" stroke="#6a4a32" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M270 92 H296 M270 98 H290 M270 104 H298 M270 110 H284" stroke="#6a4a32" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- alchymista (projektový manažer) -->
    <ellipse cx="160" cy="398" rx="96" ry="12" fill="#000000" opacity=".35"/>
    <!-- plášť -->
    <path d="M114 170 Q98 270 66 398 L246 398 Q226 300 218 192 Q206 162 164 160 Q128 160 114 170 Z" fill="url(#robe)"/>
    <path d="M114 170 Q98 270 66 398 L246 398 Q226 300 218 192 Q206 162 164 160 Q128 160 114 170 Z" fill="url(#robeLit)"/>
    <path d="M130 196 Q124 290 104 392" stroke="#000000" stroke-opacity=".25" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M168 196 Q170 300 158 392" stroke="#000000" stroke-opacity=".18" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- zlatý lem a pás -->
    <path d="M198 176 Q206 280 220 396" stroke="#c9a24a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M112 270 Q166 284 222 266" stroke="#c9a24a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="196" cy="276" r="6" fill="#d9b25a"/>
    <circle cx="196" cy="276" r="2.5" fill="#7a5a2a"/>
    <!-- visačka projektového manažera -->
    <path d="M182 178 L190 222 L198 180" stroke="#8577f0" stroke-width="2" fill="none"/>
    <rect x="182" y="220" width="17" height="21" rx="3" fill="#e9e6ff"/>
    <rect x="185" y="225" width="11" height="4" rx="1" fill="#5b4bdb"/>
    <rect x="185" y="232" width="8" height="2" rx="1" fill="#9a93c9"/>

    <!-- kápě -->
    <path d="M116 180 Q100 120 132 84 Q156 58 186 66 Q218 78 222 118 Q226 152 212 178 Q188 166 156 172 Q134 176 116 180 Z" fill="url(#hood)"/>
    <path d="M132 84 Q156 58 186 66 Q218 78 222 118" fill="none" stroke="#9fb0ff" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M118 176 Q106 128 130 92" fill="none" stroke="#9fb0ff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
    <!-- otvor kápě a obličej z profilu -->
    <path d="M172 92 Q210 96 216 128 Q218 158 202 176 Q186 156 178 132 Q172 112 172 92 Z" fill="#100d1c"/>
    <path d="M186 100 Q199 102 204 113 L213 126 Q210 129 206 130 Q208 136 204 139 Q206 145 200 150 Q192 155 186 150 Q180 128 186 100 Z" fill="url(#skin)"/>
    <path d="M196 112 Q201 110 205 113" stroke="#2a1a14" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M197 117 Q200 115.5 203 117" stroke="#2a1a14" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M206 131 Q203 132.5 201 132" stroke="#5a3027" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M213 126 L206 125" stroke="#7a4c3a" stroke-width="1" opacity=".6"/>
    <path d="M204 113 L213 126 Q210 129 206 130 Q208 136 204 139 Q206 145 200 150" fill="none" stroke="#9ff0e3" stroke-opacity=".55" stroke-width="1.6"/>
    <!-- rukáv a ruka nad kotlem -->
    <path d="M200 182 Q246 170 288 184 L296 214 Q252 216 204 216 Z" fill="#2f2862"/>
    <path d="M200 182 Q246 170 288 184 L296 214 Q252 216 204 216 Z" fill="url(#robeLit)"/>
    <path d="M206 186 Q246 178 284 190" stroke="#c9a24a" stroke-width="2" fill="none" opacity=".7"/>
    <ellipse cx="292" cy="199" rx="7" ry="15" fill="#120f1f"/>
    <!-- dlaň a roztažené prsty (zespodu osvětlené lektvarem) -->
    <g stroke-linecap="round" fill="none">
      <path d="M311 193 L333 189" stroke="#c49580" stroke-width="5"/>
      <path d="M313 197 L337 195" stroke="#c49580" stroke-width="5.2"/>
      <path d="M312 201 L335 202" stroke="#b9a08e" stroke-width="5"/>
      <path d="M309 205 L329 209" stroke="#a9b4a6" stroke-width="4.6"/>
      <path d="M300 206 L312 214" stroke="#a9c4b8" stroke-width="5"/>
    </g>
    <path d="M290 193 Q302 188 313 191 Q318 199 313 206 Q301 211 291 207 Z" fill="url(#hand)"/>
    <g stroke="#e6fffa" stroke-opacity=".5" stroke-width="1" fill="none" stroke-linecap="round">
      <path d="M318 204 L334 205"/><path d="M314 208 L328 211"/><path d="M304 210 L311 215"/>
    </g>
  </g>
</svg>
