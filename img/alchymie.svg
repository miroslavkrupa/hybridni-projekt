<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="t">
  <title id="t">Projektový manažer vaří v kotli projektovou metodiku</title>
  <style>
    .bg { fill: #EEE9FF; }
    .dot { fill: #D9D1FF; }
    .steam { stroke: #FFFFFF; }
    .edge { stroke: transparent; stroke-width: 2.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2A2645; }
      .dot { fill: #3A3460; }
      .steam { stroke: #CFC8FF; }
      .edge { stroke: #8A82C4; }
    }
  </style>
  <defs>
