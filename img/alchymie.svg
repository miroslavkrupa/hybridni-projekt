      <stop offset="0" stop-color="#8577F0"/>
      <stop offset=".55" stop-color="#5B4BDB"/>
      <stop offset="1" stop-color="#1F9D8A"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF7A2F"/>
      <stop offset="1" stop-color="#FFC83D"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B3650"/>
      <stop offset=".5" stop-color="#2B2738"/>
      <stop offset="1" stop-color="#211E2C"/>
    </linearGradient>
  </defs>

